# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    project:
      default:
        # TEMPORARY: widened from 1% for the vitest v5 upgrade PR. Vitest 5
        # made @vitest/coverage-v8's AST-aware remapping mandatory (it was
        # optional/experimental under v3), which removes false positives the
        # old remapping counted as covered - our true project coverage was
        # never really ~88%, it's ~79%, and that's now measured accurately.
        # Once main reflects this new accurate baseline, tighten this back
        # down to 1-2% so the gate resumes catching real regressions instead
        # of absorbing a one-time measurement-tool step change.
        # TODO(security/dependabot-fixes follow-up): revert to 1% after merge.
        threshold: 10%
    patch:
      default:
        # New code must have at least 50% coverage
        target: 50%

comment:
  # Show coverage comment on PRs
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

# Ignore generated files and config files from coverage
ignore:
  - "dist/**/*"
  - "node_modules/**/*"
  - "*.config.js"
  - "*.config.ts"
  - "scripts/**/*"
  - "src/integrations/supabase/**/*"  # Auto-generated Supabase types
